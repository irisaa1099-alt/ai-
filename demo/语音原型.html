<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色语音原型 · AI 聊天网站</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e7e9ee; --dim:#8b93a7; --accent:#6c8cff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  button{font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel2);
    color:var(--text); border-radius:8px; padding:6px 12px; transition:.15s}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.4; cursor:not-allowed}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  select,input,textarea{font:inherit; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 8px; outline:none}
  select:focus,input:focus,textarea:focus{border-color:var(--accent)}

  .app{display:grid; grid-template-columns:280px 1fr; height:100vh; max-width:1200px; margin:0 auto;
    border-left:1px solid var(--line); border-right:1px solid var(--line)}
  /* 左侧：角色列表 + 声线设置 */
  .side{background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:14px}
  .side h1{font-size:14px; margin:0 0 4px; letter-spacing:.5px}
  .side .sub{color:var(--dim); font-size:12px; margin-bottom:14px}
  .charcard{display:flex; gap:10px; align-items:center; padding:10px; border-radius:10px;
    border:1px solid transparent; cursor:pointer; margin-bottom:4px}
  .charcard:hover{background:var(--panel2)}
  .charcard.on{background:var(--panel2); border-color:var(--accent)}
  .charcard .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    font-size:19px;background:#2a2f3a;flex:0 0 auto}
  .charcard .nm{font-weight:600}
  .charcard .ds{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vset{margin-top:16px; border-top:1px solid var(--line); padding-top:14px}
  .vset h2{font-size:12px; color:var(--dim); margin:0 0 10px; font-weight:600; letter-spacing:.5px}
  .row{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .row label{font-size:12px; color:var(--dim); flex:0 0 34px}
  .row select,.row input[type=text],.row input[type=password]{flex:1; min-width:0}
  input[type=range]{flex:1; accent-color:var(--accent)}
  .val{font-size:12px;color:var(--dim);width:30px;text-align:right}

  /* 右侧：聊天 */
  .main{display:flex; flex-direction:column; min-width:0}
  .top{display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line);
    background:var(--panel)}
  .top .nm{font-weight:600}
  .top .st{font-size:12px; color:var(--dim)}
  .top .sp{flex:1}
  .chat{flex:1; overflow-y:auto; padding:20px 18px; display:flex; flex-direction:column; gap:14px}
  .msg{display:flex; gap:10px; max-width:76%}
  .msg.me{align-self:flex-end; flex-direction:row-reverse}
  .msg .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;
    flex:0 0 auto}
  .msg .bub{padding:9px 13px; border-radius:14px; background:var(--panel2); border:1px solid var(--line);
    white-space:pre-wrap; word-break:break-word}
  .msg.me .bub{background:var(--accent); border-color:var(--accent); color:#fff}
  .msg .bub.speaking{border-color:#4ec9a8; box-shadow:0 0 0 2px rgba(78,201,168,.18)}
  .msg .tools{font-size:11px;color:var(--dim);margin-top:4px;display:flex;gap:8px}
  .msg .tools button{padding:1px 7px; font-size:11px; border-radius:6px}
  .typing::after{content:"▍"; animation:bl .9s steps(2) infinite; color:var(--dim)}
  @keyframes bl{50%{opacity:0}}

  /* 底部输入 */
  .bottom{border-top:1px solid var(--line); background:var(--panel); padding:12px 18px}
  .inputline{display:flex; gap:10px; align-items:flex-end}
  textarea{flex:1; resize:none; height:44px; max-height:120px; line-height:1.5; padding:11px 12px}
  .ctl{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--dim)}
  .pill{padding:3px 9px; border-radius:20px; background:var(--panel2); border:1px solid var(--line)}
  .pill.on{border-color:#4ec9a8; color:#4ec9a8}
  .pill.rec{border-color:#ff6b6b; color:#ff6b6b; animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.45}}
  .metric{margin-left:auto; font-variant-numeric:tabular-nums}

  /* 调试面板 */
  .debug{border-top:1px solid var(--line); background:#0b0d11; max-height:150px; overflow-y:auto;
    padding:8px 18px; font:11px/1.7 ui-monospace,Menlo,Consolas,monospace; color:var(--dim); display:none}
  .debug.on{display:block}
  .debug .k{color:#6c8cff}
  .debug .g{color:#4ec9a8}
  .debug .y{color:#e0b341}
  .hint{font-size:11px;color:var(--dim);margin-top:8px}
  .warn{font-size:11px;color:#e0b341}
</style>
</head>
<body>
<div class="app">
  <!-- ============ 左侧 ============ -->
  <aside class="side">
    <h1>角色语音原型</h1>
    <div class="sub">流式断句 → 逐句合成 → 队列播放</div>
    <div id="charList"></div>

    <div class="vset">
      <h2>当前角色声线</h2>
      <div class="row"><label>音色</label><select id="voiceSel"></select></div>
      <div class="row"><label>语速</label><input type="range" id="rate" min="0.5" max="1.8" step="0.05"><span class="val" id="rateV"></span></div>
      <div class="row"><label>音调</label><input type="range" id="pitch" min="0.5" max="1.8" step="0.05"><span class="val" id="pitchV"></span></div>
      <div class="row"><button id="testBtn" style="flex:1">🔊 试听这句话</button></div>
      <div id="voiceWarn" class="warn"></div>
    </div>

    <div class="vset">
      <h2>TTS 引擎</h2>
      <div class="row">
        <button id="modeLocal" class="primary" style="flex:1">浏览器内置</button>
        <button id="modeCloud" style="flex:1">云端 API</button>
      </div>
      <div id="cloudBox" style="display:none">
        <div class="row"><label>接口</label><input type="text" id="cEndpoint" placeholder="https://api.openai.com/v1/audio/speech"></div>
        <div class="row"><label>模型</label><input type="text" id="cModel" placeholder="gpt-4o-mini-tts"></div>
        <div class="row"><label>音色</label><input type="text" id="cVoice" placeholder="nova"></div>
        <div class="row"><label>密钥</label><input type="password" id="cKey" placeholder="sk-..."></div>
        <div class="hint">⚠️ 仅本地演示用。浏览器直连会暴露密钥，正式产品请走自己的代理接口。</div>
      </div>
    </div>

    <div class="vset">
      <h2>流水线参数</h2>
      <div class="row"><label>首句</label><input type="range" id="minFirst" min="2" max="30" step="1"><span class="val" id="minFirstV"></span></div>
      <div class="row"><label>断句</label><input type="range" id="minLen" min="4" max="40" step="1"><span class="val" id="minLenV"></span></div>
      <div class="row"><label>预取</label><input type="range" id="prefetchN" min="0" max="4" step="1"><span class="val" id="prefetchV"></span></div>
      <div class="hint">首句阈值调小 → 角色更快"开口"，但句子更碎。</div>
      <div class="row" style="margin-top:8px"><button id="debugBtn" style="flex:1">显示调试面板</button></div>
    </div>
  </aside>

  <!-- ============ 右侧 ============ -->
  <div class="main">
    <div class="top">
      <div class="av" id="topAv" style="width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#2a2f3a"></div>
      <div>
        <div class="nm" id="topName"></div>
        <div class="st" id="topStatus">在线</div>
      </div>
      <div class="sp"></div>
      <button id="unlockBtn" class="primary">🔊 开启语音</button>
    </div>

    <div class="chat" id="chat"></div>

    <div class="bottom">
      <div class="inputline">
        <textarea id="input" placeholder="说点什么…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button id="micBtn" title="语音输入">🎤</button>
        <button id="sendBtn" class="primary">发送</button>
      </div>
      <div class="ctl">
        <span class="pill" id="statePill">就绪</span>
        <span class="pill" id="queuePill">队列 0</span>
        <button id="stopBtn">⏹ 打断</button>
        <button id="pauseBtn">⏸ 暂停</button>
        <div class="metric" id="metric">首次出声 —</div>
      </div>
      <div class="hint" id="micHint"></div>
    </div>

    <div class="debug" id="debug"></div>
  </div>
</div>

<script>
/* =====================================================================
   0. 工具
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* =====================================================================
   1. 角色数据（声线是角色的一部分，跟头像、主题色同级）
   ===================================================================== */
const CHARACTERS = [
  {
    id:'lin', name:'林晚', avatar:'🌙', color:'#6c8cff',
    desc:'温柔、略带疏离的插画师',
    voice:{ rate:0.95, pitch:1.08, voiceURI:null },
    replies:[
      '……嗯，你来了。今天画了一整天的画，手指有点酸。你呢，今天过得怎么样？',
      '刚才在窗边看了很久的云。它们慢吞吞地飘过去，像什么都不着急。我也想那样过日子。',
      '你要是累了就别硬撑。我这里有一杯温的茶，替你留着，不着急喝。'
    ]
  },
  {
    id:'qi', name:'祁野', avatar:'🔥', color:'#f2803c',
    desc:'毒舌但靠谱的电竞选手',
    voice:{ rate:1.15, pitch:0.88, voiceURI:null },
    replies:[
      '哟，还知道上线啊？我以为你把我忘了呢。快点说正事，今晚到底打不打？',
      '别磨磨蹭蹭的，菜就多练。……算了，看在你请我喝奶茶的份上，带你飞一把。',
      '行吧，这波我认。你刚才那个操作确实有点东西，勉强夸你一句——勉强啊。'
    ]
  },
  {
    id:'su', name:'苏老师', avatar:'📚', color:'#4ec9a8',
    desc:'沉稳耐心的物理老师',
    voice:{ rate:0.9, pitch:1.0, voiceURI:null },
    replies:[
      '先别急着背公式。你告诉我，这道题里物体受到的合力方向是哪里？想清楚方向，剩下的都是数学。',
      '很好，这次思路对了。记住这种感觉——物理不是记答案，是把看不见的东西想出来。',
      '错了也没关系，我们来看看是哪一步想岔了。错误比正确答案更能告诉你卡在哪里。'
    ]
  }
];

/* =====================================================================
   2. 断句器：流式喂入字符，吐出"可以送去合成的完整句子"
      首句阈值故意更小 —— 让角色尽快开口，这是主观延迟的关键
   ===================================================================== */
const HARD = '。！？!?…；;\n';
const SOFT = '，,、：:~—';

function createSplitter(opts){
  let buf = '', emitted = 0;
  return {
    push(chunk){
      buf += chunk;
      const out = [];
      let guard = 0;
      while (guard++ < 80){
        const min = emitted === 0 ? opts.minFirst : opts.min;
        let cut = -1;
        for (let i = 0; i < buf.length; i++){
          if (HARD.indexOf(buf[i]) >= 0 && i + 1 >= min){ cut = i + 1; break; }
        }
        if (cut < 0 && buf.length >= opts.max){
          let soft = -1;
          for (let i = 0; i < buf.length; i++) if (SOFT.indexOf(buf[i]) >= 0) soft = i + 1;
          cut = soft > min ? soft : opts.max;
        }
        if (cut < 0) break;
        const s = buf.slice(0, cut).trim();
        buf = buf.slice(cut);
        if (s){ out.push(s); emitted++; }
      }
      return out;
    },
    flush(){ const s = buf.trim(); buf = ''; return s ? [s] : []; }
  };
}

/* =====================================================================
   3. 播放队列：串行播放 + 预取 + 可打断（barge-in）
   ===================================================================== */
class SpeechQueue {
  constructor(speaker, cfg, hooks){
    this.speaker = speaker; this.cfg = cfg; this.hooks = hooks || {};
    this.q = []; this.busy = false; this.gen = 0; this.done = null;
  }
  get length(){ return this.q.length; }
  push(sentences){
    if (!sentences || !sentences.length) return;
    this.q.push(...sentences);
    this._prefetch();
    void this.pump();
  }
  _prefetch(){
    const n = Number($('prefetchN').value) || 0;
    this.q.slice(0, n).forEach(s => { try { this.speaker.warm && this.speaker.warm(s, this.cfg); } catch(e){} });
  }
  stop(){
    this.gen++;
    this.q = [];
    this.speaker.stop();
    this.busy = false;
    if (this.done) this.done();
    if (this.hooks.onState) this.hooks.onState('stopped', 0);
  }
  /** 返回一个在"队列全部播完"后 resolve 的 Promise */
  idle(){
    if (!this.busy && !this.q.length) return Promise.resolve();
    return new Promise(res => { this.done = res; });
  }
  async pump(){
    if (this.busy) return;
    this.busy = true;
    const my = this.gen;
    while (this.q.length && my === this.gen){
      const text = this.q.shift();
      this._prefetch();
      if (this.hooks.onState) this.hooks.onState('speaking', this.q.length, text);
      try {
        await this.speaker.speak(text, this.cfg, () => { if (my === this.gen && this.hooks.onStart) this.hooks.onStart(); });
      } catch (e){
        if (this.hooks.onState) this.hooks.onState('error', this.q.length, String(e && e.message || e));
      }
    }
    if (my === this.gen){
      this.busy = false;
      if (this.hooks.onState) this.hooks.onState('idle', 0);
      if (this.done && !this.q.length){ const d = this.done; this.done = null; d(); }
    }
  }
}

/* =====================================================================
   4. 说话者 A：浏览器内置 Web Speech API（零成本，今天就能用）
   ===================================================================== */
let voices = [];
let voicesByURI = {};
let currentAudio = null;

const localSpeaker = {
  name: 'webspeech',
  speak(text, cfg, onStart){
    return new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(text);
      const v = voicesByURI[cfg.voiceURI];
      if (v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'zh-CN'; }
      u.rate = cfg.rate; u.pitch = cfg.pitch; u.volume = 1;
      let done = false;
      const finish = () => { if (done) return; done = true; clearTimeout(wd); resolve(); };
      u.onstart = () => { if (onStart) onStart(); };
      u.onend = finish;
      u.onerror = finish;
      // 看门狗：部分浏览器 onend 不触发，会让队列永久卡住
      const est = Math.max(2500, (text.length / (4.6 * cfg.rate)) * 1000 + 1500);
      const wd = setTimeout(finish, est);
      try {
        speechSynthesis.speak(u);
        if (speechSynthesis.paused) speechSynthesis.resume();
      } catch (e){ finish(); }
    });
  },
  stop(){ try { speechSynthesis.cancel(); } catch(e){} }
};

/* =====================================================================
   5. 说话者 B：云端 TTS（OpenAI 兼容接口）+ 内存缓存
   ===================================================================== */
const cloudSpeaker = {
  name: 'cloud',
  cache: new Map(),
  cfg(){
    return {
      endpoint: $('cEndpoint').value.trim(),
      model: $('cModel').value.trim(),
      voice: $('cVoice').value.trim(),
      key: $('cKey').value.trim()
    };
  },
  async warm(text, cfg){
    try { await this._blobUrl(text, cfg); } catch(e){}
  },
  async _blobUrl(text, cfg){
    const c = this.cfg();
    const key = text + '|' + c.model + '|' + c.voice + '|' + cfg.rate;
    if (this.cache.has(key)) return this.cache.get(key);
    const res = await fetch(c.endpoint, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + c.key },
      body: JSON.stringify({ model:c.model, input:text, voice:c.voice, speed:cfg.rate })
    });
    if (!res.ok) throw new Error('TTS ' + res.status + ' ' + (await res.text()).slice(0,120));
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    this.cache.set(key, url);
    return url;
  },
  async speak(text, cfg, onStart){
    const url = await this._blobUrl(text, cfg);
    const audio = new Audio(url);
    currentAudio = audio;
    return new Promise((resolve, reject) => {
      audio.onplaying = () => { if (onStart) onStart(); };
      audio.onended = () => { if (currentAudio === audio) currentAudio = null; resolve(); };
      audio.onerror = () => { if (currentAudio === audio) currentAudio = null; reject(new Error('音频播放失败')); };
      audio.play().catch(reject);
    });
  },
  stop(){ if (currentAudio){ try { currentAudio.pause(); currentAudio.src = ''; } catch(e){} currentAudio = null; } }
};

let mode = 'local';
function speaker(){ return mode === 'local' ? localSpeaker : cloudSpeaker; }

/* =====================================================================
   6. 状态
   ===================================================================== */
let current = CHARACTERS[0];
let queue = null;
let splitter = null;
let streaming = false;
let sendT0 = 0;
let firstAudioLogged = false;
let replyIdx = {};

/* =====================================================================
   7. 调试日志
   ===================================================================== */
const logEl = $('debug');
function log(tag, msg, cls){
  const t = (performance.now() / 1000).toFixed(2);
  const line = document.createElement('div');
  line.innerHTML = '<span class="k">[' + t + ']</span> <span class="' + (cls||'') + '">' + tag + '</span> ' +
    String(msg).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  while (logEl.children.length > 300) logEl.removeChild(logEl.firstChild);
}

/* =====================================================================
   8. 音色列表：getVoices() 是异步的，必须监听 onvoiceschanged
   ===================================================================== */
function refreshVoices(){
  voices = speechSynthesis.getVoices() || [];
  voicesByURI = {};
  voices.forEach(v => { voicesByURI[v.voiceURI] = v; });

  const zh = voices.filter(v => /^zh/i.test(v.lang));
  const pool = zh.length ? zh : voices;

  // 给每个角色分配不同音色，保证"一人一嗓"开箱即用
  CHARACTERS.forEach((c, i) => {
    if (c.voice.voiceURI && voicesByURI[c.voice.voiceURI]) return;
    c.voice.voiceURI = pool.length ? pool[i % pool.length].voiceURI : null;
  });

  $('voiceWarn').textContent = zh.length
    ? ''
    : '未检测到中文音色，将使用默认音色。建议安装系统中文语音包，或改用云端 TTS。';

  renderVoiceSelect();
  renderChars();
  log('voices', '共 ' + voices.length + ' 个音色，其中中文 ' + zh.length + ' 个', 'g');
}

function renderVoiceSelect(){
  const sel = $('voiceSel');
  sel.innerHTML = '';
  const zh = voices.filter(v => /^zh/i.test(v.lang));
  const list = zh.length ? zh.concat(voices.filter(v => !/^zh/i.test(v.lang))) : voices;
  list.forEach(v => {
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + '  ·  ' + v.lang + (v.localService ? '  (本地)' : '  (云端)');
    sel.appendChild(o);
  });
  if (current.voice.voiceURI) sel.value = current.voice.voiceURI;
}


/* =====================================================================
   9. 渲染
   ===================================================================== */
function renderChars(){
  const box = $('charList');
  box.innerHTML = '';
  CHARACTERS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'charcard' + (c === current ? ' on' : '');
    d.innerHTML = '<div class="av" style="background:' + c.color + '22;border:1px solid ' + c.color + '55">' +
      c.avatar + '</div><div style="min-width:0"><div class="nm">' + c.name +
      '</div><div class="ds">' + c.desc + '</div></div>';
    d.onclick = () => {
      if (queue) queue.stop();
      current = c;
      renderChars();
      renderVoiceSelect();
      syncVoiceControls();
      $('topName').textContent = c.name;
      $('topAv').textContent = c.avatar;
      $('topAv').style.background = c.color + '22';
      $('topAv').style.border = '1px solid ' + c.color + '55';
      chat.innerHTML = '';
      greet();
      log('switch', '切换到角色 ' + c.name);
    };
    box.appendChild(d);
  });
}

const chat = $('chat');
function addMsg(who, text){
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (who === 'me' ? ' me' : '');
  const av = document.createElement('div');
  av.className = 'av';
  if (who === 'me'){ av.textContent = '🙂'; av.style.background = '#2a2f3a'; }
  else { av.textContent = current.avatar; av.style.background = current.color + '22'; }
  const right = document.createElement('div');
  const bub = document.createElement('div');
  bub.className = 'bub' + (who === 'me' ? '' : ' typing');
  bub.textContent = text;
  right.appendChild(bub);
  wrap.appendChild(av); wrap.appendChild(right);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return { bub, right, wrap };
}

function greet(){
  const { bub } = addMsg('ai', '');
  bub.classList.remove('typing');
  bub.textContent = '（' + current.name + '向你打了个招呼）';
  bub.style.color = '#8b93a7';
}

function syncVoiceControls(){
  $('rate').value = current.voice.rate; $('rateV').textContent = Number(current.voice.rate).toFixed(2);
  $('pitch').value = current.voice.pitch; $('pitchV').textContent = Number(current.voice.pitch).toFixed(2);
  if (current.voice.voiceURI) $('voiceSel').value = current.voice.voiceURI;
}

/* =====================================================================
   10. 状态指示
   ===================================================================== */
const statePill = $('statePill');
const queuePill = $('queuePill');
function setState(s, n, text){
  queuePill.textContent = '队列 ' + (n || 0);
  if (s === 'speaking'){
    statePill.textContent = '🔊 正在说话';
    statePill.classList.add('on');
    log('queue', '播放：' + text, 'g');
  } else if (s === 'idle'){
    statePill.textContent = '就绪';
    statePill.classList.remove('on');
  } else if (s === 'stopped'){
    statePill.textContent = '已打断';
    statePill.classList.remove('on');
    log('queue', '被打断，队列清空', 'y');
  } else if (s === 'error'){
    statePill.textContent = '语音失败（已静音降级）';
    statePill.classList.remove('on');
    log('error', text, 'y');
  }
  $('topStatus').textContent = s === 'speaking' ? '正在输入…' : '在线';
}

/* =====================================================================
   11. 核心：模拟 LLM 流式输出 → 断句 → 队列 → 朗读
   ===================================================================== */
function buildQueue(){
  if (queue) queue.stop();
  splitter = createSplitter({
    minFirst: Number($('minFirst').value),
    min: Number($('minLen').value),
    max: 90
  });
  queue = new SpeechQueue(speaker(), {
    rate: current.voice.rate,
    pitch: current.voice.pitch,
    voiceURI: current.voice.voiceURI
  }, {
    onState: setState,
    onStart: () => {
      if (!firstAudioLogged){
        firstAudioLogged = true;
        const dt = ((performance.now() - sendT0) / 1000).toFixed(2);
        $('metric').textContent = '首次出声 ' + dt + 's';
        log('ttfa', '首次出声耗时 ' + dt + 's（首句阈值 ' + $('minFirst').value + ' 字）', 'g');
      }
    }
  });
  return queue;
}

async function streamText(text, onToken){
  const speed = 26;   // 模拟 LLM 每个 token 的间隔（毫秒），真实场景由 SSE 推送节奏决定
  for (let i = 0; i < text.length; i++){
    if (!streaming) return;
    onToken(text[i]);
    await sleep(speed);
  }
}

async function send(text){
  if (!text.trim() || streaming) return;
  addMsg('me', text);
  $('input').value = '';

  streaming = true;
  sendT0 = performance.now();
  firstAudioLogged = false;
  $('metric').textContent = '首次出声 …';
  $('sendBtn').disabled = true;

  const q = buildQueue();
  const { bub } = addMsg('ai', '');
  bub.classList.add('typing');

  const list = current.replies;
  const idx = (replyIdx[current.id] = ((replyIdx[current.id] || 0) + 1) % list.length);
  const reply = list[idx];

  log('llm', '开始流式输出（模拟），共 ' + reply.length + ' 字');

  bub.classList.add('speaking');
  await streamText(reply, (ch) => {
    bub.textContent += ch;
    chat.scrollTop = chat.scrollHeight;
    const sents = splitter.push(ch);
    if (sents.length){
      log('split', '断出 ' + sents.length + ' 句 → ' + sents.map(s => '「' + s + '」').join(' '));
      q.push(sents);
    }
  });
  bub.classList.remove('typing');
  const tail = splitter.flush();
  if (tail.length){ log('split', '收尾 ' + tail.length + ' 句'); q.push(tail); }
  streaming = false;
  $('sendBtn').disabled = false;
  log('llm', '流式结束，等待播放完成（队列 ' + q.length + '）');

  await q.idle();
  bub.classList.remove('speaking');
}

/* =====================================================================
   12. 语音输入（Chrome / Edge 可用）
   ===================================================================== */
let recog = null, recording = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR){
  $('micHint').textContent = '当前浏览器不支持语音识别（Chrome / Edge 可用）。生产环境建议接 Whisper 或云 ASR。';
  $('micBtn').disabled = true;
} else {
  recog = new SR();
  recog.lang = 'zh-CN';
  recog.continuous = false;
  recog.interimResults = true;
  recog.onresult = (e) => {
    let finalTxt = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if (r.isFinal) finalTxt += r[0].transcript; else interim += r[0].transcript;
    }
    if (finalTxt) $('input').value = finalTxt;
    else if (interim) $('input').value = interim;
  };
  recog.onend = () => {
    recording = false;
    $('micBtn').classList.remove('rec');
    const v = $('input').value.trim();
    if (v) send(v);
  };
  recog.onerror = (e) => {
    recording = false;
    $('micBtn').classList.remove('rec');
    log('stt', '识别失败：' + e.error, 'y');
  };
}

/* =====================================================================
   13. 事件绑定
   ===================================================================== */
$('sendBtn').onclick = () => send($('input').value);
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send($('input').value); }
});

$('micBtn').onclick = () => {
  if (!recog) return;
  if (recording){ recog.stop(); return; }
  try { recog.start(); recording = true; $('micBtn').classList.add('rec'); }
  catch(e){ log('stt', '启动失败：' + e.message, 'y'); }
};

$('stopBtn').onclick = () => {
  streaming = false;                    // 同时中断流式输出
  if (queue) queue.stop();
  document.querySelectorAll('.bub.speaking').forEach(b => b.classList.remove('speaking'));
  $('sendBtn').disabled = false;
  log('user', '用户打断（barge-in）', 'y');
};

let paused = false;
$('pauseBtn').onclick = () => {
  paused = !paused;
  if (mode !== 'local'){ log('pause', '暂停仅在浏览器内置模式下生效', 'y'); return; }
  if (paused){ speechSynthesis.pause(); $('pauseBtn').textContent = '▶ 继续'; }
  else { speechSynthesis.resume(); $('pauseBtn').textContent = '⏸ 暂停'; }
};

$('voiceSel').onchange = () => {
  current.voice.voiceURI = $('voiceSel').value;
  log('voice', current.name + ' 音色 → ' + $('voiceSel').selectedOptions[0].textContent);
};
$('rate').oninput = () => { current.voice.rate = Number($('rate').value); $('rateV').textContent = Number($('rate').value).toFixed(2); };
$('pitch').oninput = () => { current.voice.pitch = Number($('pitch').value); $('pitchV').textContent = Number($('pitch').value).toFixed(2); };

$('testBtn').onclick = async () => {
  unlock();
  const sp = speaker();
  if (sp === cloudSpeaker){
    const c = cloudSpeaker.cfg();
    if (!c.endpoint || !c.key){ log('cloud', '请先填写接口地址与密钥', 'y'); return; }
  }
  try { await sp.speak('你好，我是' + current.name + '。很高兴见到你。', { rate: current.voice.rate, pitch: current.voice.pitch, voiceURI: current.voice.voiceURI }, null); }
  catch(e){ log('cloud', String(e.message || e), 'y'); }
};

$('minFirst').oninput = () => { $('minFirstV').textContent = $('minFirst').value; };
$('minLen').oninput = () => { $('minLenV').textContent = $('minLen').value; };
$('prefetchN').oninput = () => { $('prefetchV').textContent = $('prefetchN').value; };

$('debugBtn').onclick = (e) => {
  logEl.classList.toggle('on');
  e.target.textContent = logEl.classList.contains('on') ? '隐藏调试面板' : '显示调试面板';
};

$('modeLocal').onclick = () => {
  mode = 'local';
  $('modeLocal').classList.add('primary'); $('modeCloud').classList.remove('primary');
  $('cloudBox').style.display = 'none';
  log('engine', '切换到浏览器内置 TTS');
};
$('modeCloud').onclick = () => {
  mode = 'cloud';
  $('modeCloud').classList.add('primary'); $('modeLocal').classList.remove('primary');
  $('cloudBox').style.display = 'block';
  log('engine', '切换到云端 TTS（OpenAI 兼容接口）', 'y');
};

/* 浏览器自动播放策略：必须在用户手势里解锁音频 */
let unlocked = false;
function unlock(){
  if (unlocked) return;
  unlocked = true;
  try {
    const a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=');
    a.volume = 0; a.play().catch(() => {});
  } catch(e){}
  $('unlockBtn').textContent = '🔊 语音已开启';
  $('unlockBtn').classList.remove('primary');
  log('audio', '音频上下文已解锁', 'g');
}
$('unlockBtn').onclick = unlock;
document.addEventListener('click', unlock, { once: true });

/* =====================================================================
   14. 初始化
   ===================================================================== */
$('minFirst').value = 8;  $('minFirstV').textContent = '8';
$('minLen').value = 14;   $('minLenV').textContent = '14';
$('prefetchN').value = 2; $('prefetchV').textContent = '2';

speechSynthesis.onvoiceschanged = refreshVoices;
refreshVoices();
// 有些浏览器首次返回空数组，稍后再取一次
setTimeout(refreshVoices, 300);
setTimeout(refreshVoices, 1200);

renderChars();
$('topName').textContent = current.name;
$('topAv').textContent = current.avatar;
$('topAv').style.background = current.color + '22';
$('topAv').style.border = '1px solid ' + current.color + '55';
syncVoiceControls();
greet();

log('ready', '原型就绪。点「开启语音」后发送消息，观察断句与播报时序。', 'g');
log('tip', '提示：在左侧调「首句阈值」和「预取」数量，对比首次出声耗时的变化。');
</script>
</body>
