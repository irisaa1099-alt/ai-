<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AI 好友">
  <title>AI 好友</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2030" />
      <stop offset="100%" stop-color="#0f1115" />
    </linearGradient>
    <linearGradient id="bubble" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#8aa4ff" />
      <stop offset="100%" stop-color="#6c8cff" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角方块底 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)" />
  <rect
    x="6"
    y="6"
    width="500"
    height="500"
    rx="107"
    ry="107"
    fill="none"
    stroke="#6c8cff"
    stroke-opacity="0.28"
    stroke-width="4"
  />

  <!-- 对话气泡 -->
  <path
    d="M256 112c-79.5 0-144 52.4-144 117 0 36.9 21.1 69.7 54.2 91.3-2.6 22.6-11.6 41.4-27 56.2-4.6 4.4-1.4 12.2 5 11.6 34.4-3.2 61.3-14.4 80.6-27.6 10 2 20.5 3.1 31.2 3.1 79.5 0 144-52.4 144-117S335.5 112 256 112Z"
    fill="url(#bubble)"
  />

  <!-- 气泡里的三个小圆点（正在输入） -->
  <circle cx="204" cy="231" r="15" fill="#0f1115" fill-opacity="0.72" />
  <circle cx="256" cy="231" r="15" fill="#0f1115" fill-opacity="0.72" />
  <circle cx="308" cy="231" r="15" fill="#0f1115" fill-opacity="0.72" />

  <!-- 右上角星点 -->
  <path
    d="M392 92l13.4 33.3L438 139l-32.6 13.7L392 186l-13.4-33.3L346 139l32.6-13.7Z"
    fill="#e7e9ee"
    filter="url(#glow)"
  />

  <!-- 左下角小星点 -->
  <path d="M124 372l7.2 18 17.8 7.4-17.8 7.4-7.2 18-7.2-18-17.8-7.4 17.8-7.4Z" fill="#6c8cff" fill-opacity="0.85" />
</svg>
